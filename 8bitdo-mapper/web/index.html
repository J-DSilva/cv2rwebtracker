<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>8bitdo Keyboard Mapper</title>
  <style>
    * {
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      margin: 0;
      padding: 20px;
      min-height: 100vh;
    }
    
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      padding: 40px;
    }
    
    h1 {
      margin: 0 0 10px 0;
      color: #333;
      font-size: 2.5em;
    }
    
    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 1.1em;
    }
    
    .status {
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 30px;
      display: none;
    }
    
    .status.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
      display: block;
    }
    
    .status.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
      display: block;
    }
    
    .status.info {
      background: #d1ecf1;
      color: #0c5460;
      border: 1px solid #bee5eb;
      display: block;
    }
    
    .button {
      background: #667eea;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      font-size: 1em;
      cursor: pointer;
      transition: background 0.3s;
      margin-right: 10px;
    }
    
    .button:hover {
      background: #5568d3;
    }
    
    .button.secondary {
      background: #6c757d;
    }
    
    .button.secondary:hover {
      background: #5a6268;
    }
    
    .button.danger {
      background: #dc3545;
    }
    
    .button.danger:hover {
      background: #c82333;
    }
    
    .button.success {
      background: #28a745;
    }
    
    .button.success:hover {
      background: #218838;
    }
    
    .section {
      margin-bottom: 40px;
    }
    
    .section h2 {
      color: #333;
      margin-bottom: 20px;
      font-size: 1.8em;
    }
    
    .mappings-list {
      border: 1px solid #ddd;
      border-radius: 8px;
      overflow: hidden;
    }
    
    .mapping-item {
      display: flex;
      align-items: center;
      padding: 15px;
      border-bottom: 1px solid #ddd;
      transition: background 0.2s;
    }
    
    .mapping-item:last-child {
      border-bottom: none;
    }
    
    .mapping-item:hover {
      background: #f8f9fa;
    }
    
    .mapping-key {
      font-weight: bold;
      color: #667eea;
      font-family: 'Courier New', monospace;
      min-width: 120px;
      font-size: 1.1em;
    }
    
    .mapping-arrow {
      margin: 0 15px;
      color: #999;
    }
    
    .mapping-action {
      flex: 1;
    }
    
    .mapping-type {
      display: inline-block;
      background: #e9ecef;
      padding: 4px 12px;
      border-radius: 4px;
      font-size: 0.85em;
      color: #495057;
      margin-bottom: 5px;
    }
    
    .mapping-command {
      color: #333;
      font-family: 'Courier New', monospace;
      font-size: 0.95em;
    }
    
    .mapping-actions {
      display: flex;
      gap: 10px;
    }
    
    .icon-button {
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px;
      border-radius: 4px;
      transition: background 0.2s;
      font-size: 1.2em;
    }
    
    .icon-button:hover {
      background: #e9ecef;
    }
    
    .icon-button.delete:hover {
      background: #f8d7da;
      color: #dc3545;
    }
    
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    
    .modal.active {
      display: flex;
    }
    
    .modal-content {
      background: white;
      border-radius: 12px;
      padding: 30px;
      max-width: 500px;
      width: 90%;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    }
    
    .modal h3 {
      margin-top: 0;
      color: #333;
    }
    
    .form-group {
      margin-bottom: 20px;
    }
    
    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 500;
    }
    
    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 1em;
      font-family: inherit;
    }
    
    .form-group textarea {
      min-height: 80px;
      font-family: 'Courier New', monospace;
    }
    
    .key-capture {
      background: #f8f9fa;
      border: 2px dashed #667eea;
      padding: 30px;
      text-align: center;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    
    .key-capture.active {
      background: #d1ecf1;
      border-color: #17a2b8;
    }
    
    .captured-key {
      font-size: 2em;
      font-weight: bold;
      color: #667eea;
      font-family: 'Courier New', monospace;
      margin-top: 10px;
    }
    
    .help-text {
      color: #6c757d;
      font-size: 0.9em;
      margin-top: 5px;
    }
    
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #6c757d;
    }
    
    .empty-state-icon {
      font-size: 4em;
      margin-bottom: 20px;
      opacity: 0.5;
    }
    
    .action-examples {
      background: #f8f9fa;
      padding: 15px;
      border-radius: 6px;
      margin-top: 15px;
      font-size: 0.9em;
    }
    
    .action-examples h4 {
      margin-top: 0;
      color: #333;
      font-size: 1em;
    }
    
    .action-examples code {
      background: white;
      padding: 2px 6px;
      border-radius: 3px;
      font-family: 'Courier New', monospace;
      color: #e83e8c;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎮 8bitdo Keyboard Mapper</h1>
    <p class="subtitle">Map your 8bitdo retro keyboard buttons to any action on Mac</p>
    
    <div id="status" class="status"></div>
    
    <div class="section">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2>Key Mappings</h2>
        <div>
          <button class="button success" onclick="openAddModal()">+ Add New Mapping</button>
          <button class="button secondary" onclick="refreshMappings()">🔄 Refresh</button>
        </div>
      </div>
      
      <div id="mappings-container">
        <div class="empty-state">
          <div class="empty-state-icon">⌨️</div>
          <p>No key mappings configured yet</p>
          <p style="font-size: 0.9em;">Click "Add New Mapping" to get started</p>
        </div>
      </div>
    </div>
  </div>
  
  <!-- Add/Edit Mapping Modal -->
  <div id="mapping-modal" class="modal">
    <div class="modal-content">
      <h3 id="modal-title">Add Key Mapping</h3>
      
      <div class="key-capture" id="key-capture">
        <div>Press any key to capture</div>
        <div class="captured-key" id="captured-key" style="display: none;"></div>
      </div>
      
      <form id="mapping-form" onsubmit="saveMapping(event)">
        <input type="hidden" id="captured-key-value">
        
        <div class="form-group">
          <label for="action-type">Action Type</label>
          <select id="action-type" required onchange="updateActionExamples()">
            <option value="command">Shell Command</option>
            <option value="shortcut">Keyboard Shortcut</option>
            <option value="applescript">AppleScript</option>
            <option value="text">Type Text</option>
          </select>
        </div>
        
        <div class="form-group">
          <label for="action-value">Action</label>
          <textarea id="action-value" required placeholder="Enter your command..."></textarea>
          <div class="help-text" id="action-help"></div>
        </div>
        
        <div class="action-examples" id="action-examples"></div>
        
        <div style="margin-top: 25px; display: flex; gap: 10px;">
          <button type="submit" class="button success">Save Mapping</button>
          <button type="button" class="button secondary" onclick="testAction()">Test Action</button>
          <button type="button" class="button secondary" onclick="closeModal()">Cancel</button>
        </div>
      </form>
    </div>
  </div>
  
  <script>
    const API_BASE = '';
    let currentMappings = {};
    let isCapturingKey = false;
    let capturedKey = null;
    
    // Action type examples and help text
    const actionExamples = {
      command: {
        help: 'Enter a shell command to execute',
        examples: [
          'open -a "Safari" - Open Safari',
          'open -a "Spotify" - Open Spotify',
          'pmset displaysleepnow - Sleep displays',
          'osascript -e "set volume output volume 50" - Set volume'
        ]
      },
      shortcut: {
        help: 'Enter keyboard shortcut using Command, Control, Alt, Shift',
        examples: [
          'Command+Space - Spotlight',
          'Command+Tab - App switcher',
          'Control+Up - Mission Control',
          'Command+Shift+5 - Screenshot'
        ]
      },
      applescript: {
        help: 'Enter AppleScript code to execute',
        examples: [
          'tell application "System Events" to keystroke "Hello"',
          'display notification "Button pressed!"',
          'tell application "iTunes" to playpause',
          'set volume output volume 50'
        ]
      },
      text: {
        help: 'Enter text to type when key is pressed',
        examples: [
          'Your frequently used text or snippets',
          'Email signatures',
          'Common phrases',
          'Code snippets'
        ]
      }
    };
    
    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      refreshMappings();
      updateActionExamples();
      setupKeyCapture();
    });
    
    // Set up key capture
    function setupKeyCapture() {
      document.addEventListener('keydown', (e) => {
        if (isCapturingKey) {
          e.preventDefault();
          captureKey(e);
        }
      });
    }
    
    // Capture key press
    function captureKey(event) {
      const parts = [];
      
      if (event.ctrlKey) parts.push('Ctrl');
      if (event.altKey) parts.push('Alt');
      if (event.shiftKey) parts.push('Shift');
      if (event.metaKey) parts.push('Meta');
      
      const key = event.code || event.key || `KeyCode${event.keyCode}`;
      parts.push(key);
      
      capturedKey = parts.join('+');
      
      // Display captured key
      const keyDisplay = capturedKey
        .replace('Key', '')
        .replace('Digit', '')
        .replace('Arrow', '');
      
      document.getElementById('captured-key').textContent = keyDisplay;
      document.getElementById('captured-key').style.display = 'block';
      document.getElementById('captured-key-value').value = key;
      
      // Update UI
      const captureBox = document.getElementById('key-capture');
      captureBox.classList.add('active');
      captureBox.querySelector('div').textContent = 'Key captured! Press another key or continue below.';
    }
    
    // Open add modal
    function openAddModal() {
      document.getElementById('modal-title').textContent = 'Add Key Mapping';
      document.getElementById('mapping-form').reset();
      document.getElementById('captured-key').style.display = 'none';
      document.getElementById('captured-key-value').value = '';
      document.getElementById('key-capture').classList.remove('active');
      document.getElementById('key-capture').querySelector('div').textContent = 'Press any key to capture';
      
      capturedKey = null;
      isCapturingKey = true;
      
      document.getElementById('mapping-modal').classList.add('active');
      updateActionExamples();
    }
    
    // Close modal
    function closeModal() {
      isCapturingKey = false;
      document.getElementById('mapping-modal').classList.remove('active');
    }
    
    // Update action examples based on selected type
    function updateActionExamples() {
      const type = document.getElementById('action-type').value;
      const examples = actionExamples[type];
      
      document.getElementById('action-help').textContent = examples.help;
      
      const examplesHtml = `
        <h4>Examples:</h4>
        ${examples.examples.map(ex => `<div>• ${ex}</div>`).join('')}
      `;
      document.getElementById('action-examples').innerHTML = examplesHtml;
    }
    
    // Save mapping
    async function saveMapping(event) {
      event.preventDefault();
      
      const keyValue = document.getElementById('captured-key-value').value;
      if (!keyValue) {
        showStatus('Please capture a key first', 'error');
        return;
      }
      
      const type = document.getElementById('action-type').value;
      const action = document.getElementById('action-value').value;
      
      try {
        const response = await fetch(`${API_BASE}/api/mapping`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ key: keyValue, type, action })
        });
        
        const data = await response.json();
        
        if (data.success) {
          showStatus('Mapping saved successfully!', 'success');
          closeModal();
          refreshMappings();
        } else {
          showStatus(`Error: ${data.error}`, 'error');
        }
      } catch (error) {
        showStatus(`Error: ${error.message}`, 'error');
      }
    }
    
    // Test action
    async function testAction() {
      const type = document.getElementById('action-type').value;
      const action = document.getElementById('action-value').value;
      
      if (!action) {
        showStatus('Please enter an action to test', 'error');
        return;
      }
      
      try {
        showStatus('Testing action...', 'info');
        
        const response = await fetch(`${API_BASE}/api/test`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ type, action })
        });
        
        const data = await response.json();
        
        if (data.success) {
          showStatus('Action executed! Check if it worked.', 'success');
        } else {
          showStatus(`Error: ${data.error}`, 'error');
        }
      } catch (error) {
        showStatus(`Error: ${error.message}`, 'error');
      }
    }
    
    // Refresh mappings
    async function refreshMappings() {
      try {
        const response = await fetch(`${API_BASE}/api/mappings`);
        const data = await response.json();
        currentMappings = data.mappings;
        renderMappings();
      } catch (error) {
        showStatus(`Error loading mappings: ${error.message}`, 'error');
      }
    }
    
    // Render mappings list
    function renderMappings() {
      const container = document.getElementById('mappings-container');
      
      if (Object.keys(currentMappings).length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">⌨️</div>
            <p>No key mappings configured yet</p>
            <p style="font-size: 0.9em;">Click "Add New Mapping" to get started</p>
          </div>
        `;
        return;
      }
      
      const mappingsHtml = Object.entries(currentMappings)
        .map(([key, config]) => {
          const displayKey = key
            .replace('Key', '')
            .replace('Digit', '')
            .replace('Arrow', '');
          
          return `
            <div class="mapping-item">
              <div class="mapping-key">${displayKey}</div>
              <div class="mapping-arrow">→</div>
              <div class="mapping-action">
                <div class="mapping-type">${config.type}</div>
                <div class="mapping-command">${escapeHtml(config.action)}</div>
              </div>
              <div class="mapping-actions">
                <button class="icon-button delete" onclick="deleteMapping('${key}')" title="Delete">
                  🗑️
                </button>
              </div>
            </div>
          `;
        })
        .join('');
      
      container.innerHTML = `<div class="mappings-list">${mappingsHtml}</div>`;
    }
    
    // Delete mapping
    async function deleteMapping(key) {
      if (!confirm(`Delete mapping for ${key}?`)) {
        return;
      }
      
      try {
        const response = await fetch(`${API_BASE}/api/mapping/${encodeURIComponent(key)}`, {
          method: 'DELETE'
        });
        
        const data = await response.json();
        
        if (data.success) {
          showStatus('Mapping deleted', 'success');
          refreshMappings();
        } else {
          showStatus(`Error: ${data.error}`, 'error');
        }
      } catch (error) {
        showStatus(`Error: ${error.message}`, 'error');
      }
    }
    
    // Show status message
    function showStatus(message, type) {
      const statusEl = document.getElementById('status');
      statusEl.textContent = message;
      statusEl.className = `status ${type}`;
      
      setTimeout(() => {
        statusEl.className = 'status';
      }, 5000);
    }
    
    // Escape HTML
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
